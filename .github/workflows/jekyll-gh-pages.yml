# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Generate site data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p docs/_data

          releases=$(curl -sSfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100")

          # Newest release carrying the book PDF, and newest one carrying the slides.
          book_tag=$(jq -r '[.[] | select(any(.assets[]?; .name == "libro-linguaggi.pdf"))][0].tag_name // ""' <<<"$releases")
          book_url=$(jq -r '[.[] | select(any(.assets[]?; .name == "libro-linguaggi.pdf"))][0].assets[]? | select(.name == "libro-linguaggi.pdf") | .browser_download_url' <<<"$releases")
          slides_tag=$(jq -r '[.[] | select(any(.assets[]?; .name | test("^[0-9]+\\.pdf$")))][0].tag_name // ""' <<<"$releases")
          slides=$(jq -r '[.[] | select(any(.assets[]?; .name | test("^[0-9]+\\.pdf$")))][0].assets[]? | select(.name | test("^[0-9]+\\.pdf$")) | "\(.name)\t\(.browser_download_url)"' <<<"$releases")

          last_commit=$(git log -1 --date=format-local:'%Y-%m-%d %H:%M %Z' --format=%cd)

          {
            printf 'book_tag: "%s"\n' "$book_tag"
            printf 'book_url: "%s"\n' "$book_url"
            printf 'slides_tag: "%s"\n' "$slides_tag"
            printf 'last_commit: "%s"\n' "$last_commit"
            printf 'slides:\n'
            while IFS=$'\t' read -r name url; do
              if [ -n "$name" ]; then
                printf '  - name: "%s"\n    url: "%s"\n' "$name" "$url"
              fi
            done <<<"$slides"
          } > docs/_data/artifacts.yml

          cat docs/_data/artifacts.yml
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
